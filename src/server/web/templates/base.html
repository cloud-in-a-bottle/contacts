<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Contacts{% endblock %}</title>
<style>
:root {
  --bg: #f6f6f4; --panel: #ffffff; --ink: #1b1b19; --muted: #6a6a63;
  --line: #e2e2dc; --accent: #2f5d50; --accent-ink: #ffffff; --danger: #9a2f24;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17181a; --panel: #1f2124; --ink: #ecece8; --muted: #9a9a93;
    --line: #2e3135; --accent: #79b8a4; --accent-ink: #14201c; --danger: #e0806f;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
a { color: var(--accent); }
.topbar {
  display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
  padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 5;
}
.brand { font-weight: 650; font-size: 17px; text-decoration: none; color: var(--ink); letter-spacing: -0.01em; }
.topbar form { flex: 1 1 220px; margin: 0; }
.topbar input[type=search] { width: 100%; }
.topbar nav { display: flex; gap: 8px; }
main { max-width: 860px; margin: 0 auto; padding: 24px 20px 64px; }
input, textarea, select, button { font: inherit; color: inherit; }
input[type=text], input[type=search], input[type=date], textarea, select {
  width: 100%; padding: 8px 10px; background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px;
}
input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
textarea { min-height: 88px; resize: vertical; }
.button, button {
  display: inline-block; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--panel); color: var(--ink); text-decoration: none; cursor: pointer; white-space: nowrap;
}
.button.primary, button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.button.danger, button.danger { color: var(--danger); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.stack { display: grid; gap: 18px; }
.row { display: flex; gap: 10px; align-items: center; }
.muted { color: var(--muted); }
.empty { padding: 48px 20px; text-align: center; color: var(--muted); }
h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 10px; }

.contact-list { list-style: none; margin: 0; padding: 0; }
.contact-list li + li { border-top: 1px solid var(--line); }
.contact-list a { display: flex; gap: 12px; align-items: center; padding: 11px 14px; text-decoration: none; color: inherit; }
.contact-list a:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.avatar {
  width: 34px; height: 34px; flex: none; border-radius: 50%; object-fit: cover;
  background: color-mix(in srgb, var(--accent) 22%, var(--panel));
  display: grid; place-items: center; font-size: 13px; font-weight: 600; color: var(--ink);
}
.contact-list .who { min-width: 0; }
.contact-list .name { font-weight: 550; }
.contact-list .sub { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.detail-head { display: flex; gap: 16px; align-items: center; margin-bottom: 20px; }
.detail-head .avatar { width: 64px; height: 64px; font-size: 22px; }
dl.fields { margin: 0; display: grid; grid-template-columns: minmax(96px, 150px) 1fr; }
dl.fields dt { padding: 9px 14px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); }
dl.fields dd { padding: 9px 14px; margin: 0; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
dl.fields dt:first-of-type, dl.fields dt:first-of-type + dd { border-top: none; }
.field-group { display: grid; gap: 10px; padding: 14px; }
.field-group .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field-group label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.repeat-row { display: grid; grid-template-columns: 1fr 130px auto; gap: 8px; align-items: end; }
.repeat-row.address { grid-template-columns: 1fr; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.secret {
  display: inline-block; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--bg); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 15px;
  letter-spacing: 0.04em; user-select: all;
}
.notice { padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: color-mix(in srgb, var(--accent) 10%, transparent); }
.tag { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">Contacts</a>
  <form action="/" method="get" role="search">
    <input type="search" name="q" value="{{ search|default('') }}" placeholder="Search name, email, phone, org" aria-label="Search contacts">
  </form>
  <nav>
    <a class="button" href="/contacts/new">New contact</a>
    <a class="button" href="/settings">Settings</a>
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
